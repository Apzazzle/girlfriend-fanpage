<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Girlfriend Fan Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .container {
      position: relative;
      width: 80%;
      max-width: 800px;
      margin: 20px;
    }
    .image-container {
      position: relative;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .text-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 28px;
      white-space: nowrap;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="image-container">
      <img src="images/GG.png" alt="My Girlfriend">
      <div class="text-overlay">I love my girlfriend</div>
    </div>
  </div>

  <!-- Optional: put scripts at the end so the page renders faster -->
  <script src="main.js"></script>
</body>
</html>
