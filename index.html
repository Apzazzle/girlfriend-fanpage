<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Girlfriend Fan Page - Heart Popping Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .container {
      position: relative;
      width: 80%;
      max-width: 800px;
      margin: 20px;
    }
    .image-container {
      position: relative;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .text-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 28px;
      white-space: nowrap;
      text-align: center;
      z-index: 2;
    }
    .heart {
      position: absolute;
      font-size: 64px; /* Bigger hearts for mobile */
      color: #ff4d6d;
      animation: float 12s linear; /* Slower, linear animation */
      z-index: 1;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none; /* Disable all browser touch actions */
      padding: 15px; /* Larger tap target */
    }
    .heart.popped {
      animation: pop 0.3s ease-out forwards !important;
    }
    .score-container {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 32px;
      z-index: 1000;
      font-weight: bold;
    }
    @keyframes float {
      0% {
        transform: translateY(120vh) rotate(0deg);
      }
      100% {
        transform: translateY(-20vh) rotate(360deg);
      }
    }
    @keyframes pop {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }
    .pop-text {
      position: absolute;
      color: #ff4d6d;
      font-weight: bold;
      font-size: 24px;
      pointer-events: none;
      animation: popText 1s ease-out forwards;
      z-index: 1000;
    }
    @keyframes popText {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-20px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="score-container">Score: <span id="score">0</span></div>
  
  <!-- Preload audio with lower volume -->
  <audio id="popSound1" preload="auto">
    <source src="audio/Heritage.mp3" type="audio/mpeg">
  </audio>
  <audio id="popSound2" preload="auto">
    <source src="audio/Alright.mp3" type="audio/mpeg">
  </audio>
  <audio id="popSound3" preload="auto">
    <source src="audio/Beautiful_smile.mp3" type="audio/mpeg">
  </audio>

  <div class="container">
    <div class="image-container">
      <img src="images/GG.png" alt="My Girlfriend">
      <div class="text-overlay">I love my girlfriend</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let score = 0;
      let currentSoundIndex = 0;
      let isAudioInitialized = false;
      const scoreElement = document.getElementById('score');
      const popSounds = [
        document.getElementById('popSound1'),
        document.getElementById('popSound2'),
        document.getElementById('popSound3')
      ];

      // Set lower volume for mobile
      popSounds.forEach(sound => {
        sound.volume = 0.5;
      });

      // Initialize audio on first interaction
      function initAudio() {
        if (!isAudioInitialized) {
          isAudioInitialized = true;
          popSounds.forEach(sound => {
            sound.load();
            sound.play().then(() => {
              sound.pause();
              sound.currentTime = 0;
            }).catch(console.error);
          });
        }
      }

      // Handle both touch and click
      document.addEventListener('touchstart', initAudio, { once: true });
      document.addEventListener('click', initAudio, { once: true });

      async function playPopSound() {
        if (!isAudioInitialized) return;
        try {
          const sound = popSounds[currentSoundIndex];
          sound.currentTime = 0;
          await sound.play();
          currentSoundIndex = (currentSoundIndex + 1) % popSounds.length;
        } catch (error) {
          console.error('Error playing sound:', error);
        }
      }

      let activeHearts = 0;
      const MAX_HEARTS = 5; // Limit concurrent hearts

      function createHeart() {
        if (activeHearts >= MAX_HEARTS) return;
        
        activeHearts++;
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 80 + 10 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 9) + 's';
        
        function popHeart(e) {
          e.preventDefault();
          e.stopPropagation();
          
          if (!heart.classList.contains('popped')) {
            playPopSound();
            score += 1;
            scoreElement.textContent = score;
            heart.classList.add('popped');
            
            const popText = document.createElement('div');
            popText.className = 'pop-text';
            popText.textContent = '+1';
            popText.style.left = heart.style.left;
            popText.style.top = (heart.getBoundingClientRect().top - 20) + 'px';
            document.body.appendChild(popText);
            
            setTimeout(() => popText.remove(), 1000);
            setTimeout(() => {
              heart.remove();
              activeHearts--;
            }, 300);
          }
        }

        heart.addEventListener('touchstart', popHeart, { passive: false });
        heart.addEventListener('click', popHeart);
        
        document.body.appendChild(heart);
        
        setTimeout(() => {
          if (heart && !heart.classList.contains('popped')) {
            heart.remove();
            activeHearts--;
          }
        }, 12000);
      }
      
      // Create hearts less frequently on mobile
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      const heartInterval = isMobile ? 1200 : 800;
      
      setInterval(createHeart, heartInterval);
      
      // Start with fewer hearts
      for(let i = 0; i < 3; i++) {
        setTimeout(createHeart, i * heartInterval);
      }
    });
  </script>
</body>
</html>
