<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Girlfriend Fan Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 80%;
      max-width: 800px;
      margin: 20px;
    }
    .image-container {
      position: relative;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .text-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 28px;
      white-space: nowrap;
      text-align: center;
      z-index: 2;
    }
    .heart {
      position: absolute;
      font-size: 24px;
      color: #ff4d6d;
      animation: float 6s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-container">
      <img src="images/GG.png" alt="My Girlfriend">
      <div class="text-overlay">I love my girlfriend</div>
    </div>
  </div>
  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);
      
      setTimeout(() => {
        heart.remove();
      }, 6000);
    }
    
    // Create hearts every 300ms
    setInterval(createHeart, 300);
    
    // Create initial hearts
    for(let i = 0; i < 10; i++) {
      setTimeout(createHeart, i * 300);
    }
  </script>
</body>
</html>
