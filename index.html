<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Girlfriend Fan Page - Heart Popping Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 80%;
      max-width: 800px;
      margin: 20px;
    }
    .image-container {
      position: relative;
      width: 100%;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .text-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 28px;
      white-space: nowrap;
      text-align: center;
      z-index: 2;
    }
    .heart {
      position: absolute;
      font-size: 48px;
      color: #ff4d6d;
      animation: float 9s ease-in-out;
      z-index: 1;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s;
    }
    .heart:hover {
      transform: scale(1.2);
    }
    .heart.popped {
      animation: pop 0.3s ease-out forwards !important;
    }
    .score-container {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: rgba(0,0,0,0.7);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 32px;
      z-index: 1000;
      font-weight: bold;
    }
    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }
    @keyframes pop {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }
    .pop-text {
      position: absolute;
      color: #ff4d6d;
      font-weight: bold;
      font-size: 24px;
      pointer-events: none;
      animation: popText 1s ease-out forwards;
      z-index: 1000;
    }
    @keyframes popText {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-20px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="score-container">Score: <span id="score">0</span></div>
  <!-- Audio elements for each sound -->
  <audio id="popSound1" preload="auto">
    <source src="audio/Heritage.mp3" type="audio/mp3">
  </audio>
  <audio id="popSound2" preload="auto">
    <source src="audio/Alright.mp3" type="audio/mp3">
  </audio>
  <audio id="popSound3" preload="auto">
    <source src="audio/Beautiful_smile.mp3" type="audio/mp3">
  </audio>
  <div class="container">
    <div class="image-container">
      <img src="images/GG.png" alt="My Girlfriend">
      <div class="text-overlay">I love my girlfriend</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      let score = 0;
      let currentSoundIndex = 0;
      const scoreElement = document.getElementById('score');
      const popSounds = [
        document.getElementById('popSound1'),
        document.getElementById('popSound2'),
        document.getElementById('popSound3')
      ];

      // Function to play sound and cycle to next sound
      function playPopSound() {
        const soundClone = popSounds[currentSoundIndex].cloneNode(true);
        soundClone.play();
        
        // Remove the clone after it's done playing
        soundClone.addEventListener('ended', function() {
          this.remove();
        });

        // Cycle to next sound
        currentSoundIndex = (currentSoundIndex + 1) % popSounds.length;
      }

      function createHeart() {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 90 + 5 + 'vw';
        heart.style.animationDuration = (Math.random() * 4.5 + 4.5) + 's';
        
        heart.onclick = function(e) {
          if (!this.classList.contains('popped')) {
            e.stopPropagation();
            
            playPopSound();
            
            score += 1;
            scoreElement.textContent = score;
            
            this.classList.add('popped');
            
            const popText = document.createElement('div');
            popText.className = 'pop-text';
            popText.textContent = '+1';
            popText.style.left = this.style.left;
            popText.style.top = (this.getBoundingClientRect().top - 20) + 'px';
            document.body.appendChild(popText);
            
            setTimeout(() => {
              popText.remove();
            }, 1000);
            
            setTimeout(() => {
              this.remove();
            }, 300);
          }
        };
        
        document.body.appendChild(heart);
        
        setTimeout(() => {
          if (heart && !heart.classList.contains('popped')) {
            heart.remove();
          }
        }, 9000);
      }
      
      setInterval(createHeart, 500);
      
      for(let i = 0; i < 5; i++) {
        setTimeout(createHeart, i * 500);
      }
    });
  </script>
</body>
</html>
